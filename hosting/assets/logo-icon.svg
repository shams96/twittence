<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Twittence logo mark — a four-segment ring in gold (SEO), green (AEO), yellow (GEO), and coral (Sentiment), matching the four pillars of the Twittence score">
<title>Twittence</title>
<rect width="32" height="32" rx="8" fill="#15110c"/>
<g transform="rotate(-90 16 16)" fill="none" stroke-width="5">
<!-- SEO 30% -->
<circle cx="16" cy="16" r="13" stroke="#f0a83c" stroke-dasharray="24.50 81.68" stroke-dashoffset="0"/>
<!-- AEO 25% -->
<circle cx="16" cy="16" r="13" stroke="#3ecf72" stroke-dasharray="20.42 81.68" stroke-dashoffset="-24.50"/>
<!-- GEO 25% -->
<circle cx="16" cy="16" r="13" stroke="#ffcf5c" stroke-dasharray="20.42 81.68" stroke-dashoffset="-44.92"/>
<!-- Sentiment 20% -->
<circle cx="16" cy="16" r="13" stroke="#ff6b52" stroke-dasharray="16.34 81.68" stroke-dashoffset="-65.35"/>
</g>
</svg>
